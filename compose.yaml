# Dev services only (ADR-0010).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: quincy
      POSTGRES_PASSWORD: quincy
      POSTGRES_DB: quincy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quincy"]
      interval: 2s
      retries: 15

volumes:
  postgres-data:
