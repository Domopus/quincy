# Tool versions and tasks for the whole repo (ADR-0010).

[tools]
go = "1.27.4"
rust = "1.100.0"
"cargo:sqlx-cli" = "0.9.0"

[env]
# Local dev only; matches compose.yaml.
DATABASE_URL = "postgres://quincy:quincy@localhost:5432/quincy"
# BRIDGE_SECRET and SENDER_HASH_KEY: never committed (`mise run secrets` creates them).
_.file = ".env"

[tasks.db]
description = "Start the dev Postgres"
run = "docker compose up -d --wait postgres"

[tasks.secrets]
description = "Create .env with random dev secrets, once"
run = """
test -f .env && { echo ".env already exists"; exit 0; }
printf 'BRIDGE_SECRET=%s\nSENDER_HASH_KEY=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
"""

[tasks.dev]
description = "Run the server (migrations run at start)"
depends = ["db"]
run = "cargo run --manifest-path server/Cargo.toml --bin quincy-server"

[tasks.bridge]
description = "Run the WhatsApp bridge; first run: mise run bridge -- -pair 33612345678"
dir = "bridges/whatsapp"
run = "go run ./cmd/quincy-whatsapp"

[tasks.gen]
description = "Regenerate every committed spec and client (ADR-0010)"
run = [
  "cargo run -q --manifest-path server/Cargo.toml --bin openapi > server/openapi.json",
  "cd server && cargo sqlx prepare -- --all-targets",
  "cd bridges/whatsapp && go generate ./...",
]

[tasks.check]
description = "Format, lint and test everything"
depends = ["db"]
run = [
  "cargo fmt --manifest-path server/Cargo.toml --check",
  "cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings",
  "cargo test --manifest-path server/Cargo.toml",
  "cd bridges/whatsapp && test -z \"$(gofmt -l .)\" && go vet ./... && go test ./...",
]
